plugins {
    id 'com.android.application'
}

android {
    namespace 'com.daeyoung.jpvocab'
    compileSdk 36

    defaultConfig {
        applicationId 'com.daeyoung.jpvocab'
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName '1.0-release'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('RELEASE_STORE_FILE') ?: 'release-key.jks')
            storePassword System.getenv('RELEASE_STORE_PASSWORD') ?: 'changeit123'
            keyAlias System.getenv('RELEASE_KEY_ALIAS') ?: 'jpvocab'
            keyPassword System.getenv('RELEASE_KEY_PASSWORD') ?: 'changeit123'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}
