plugins {
    id 'com.android.application'
}

android {
    namespace 'com.daeyoung.jpvocab'
    compileSdk 36

    defaultConfig {
        applicationId 'com.daeyoung.jpvocab'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }
}
