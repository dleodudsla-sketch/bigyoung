name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Rebuild vocabulary asset
        run: |
          cat app/src/main/assets/index.b64.* | base64 -d > /tmp/index.html.gz
          gzip -dc /tmp/index.html.gz > app/src/main/assets/index.html
          test -s app/src/main/assets/index.html
          echo "Rebuilt index.html: $(wc -c < app/src/main/assets/index.html) bytes"

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: JapaneseVocab-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
