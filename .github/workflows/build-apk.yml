name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_STORE_FILE: release-key.jks
      RELEASE_STORE_PASSWORD: changeit123
      RELEASE_KEY_ALIAS: jpvocab
      RELEASE_KEY_PASSWORD: changeit123
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Rebuild and verify vocabulary asset
        shell: python
        run: |
          from pathlib import Path
          import base64, gzip, hashlib

          asset_dir = Path('app/src/main/assets')
          chunks = [asset_dir / f'index.b64.{i:02d}' for i in range(17)]
          parts = [p.read_text(encoding='ascii') for p in chunks]

          # Two source chunks were damaged during the original connector upload.
          # Repair the exact known differences before decoding.
          assert len(parts[6]) == 20006
          parts[6] = parts[6][:15380] + 'G' + parts[6][15381:20000]
          assert len(parts[6]) == 20000

          assert len(parts[10]) == 20000
          parts[10] = parts[10][:19790] + 'e' + parts[10][19791:]

          encoded = ''.join(parts)
          packed = base64.b64decode(encoded, validate=True)
          html = gzip.decompress(packed)

          expected_size = 915376
          expected_sha256 = 'df3ca4a682490d56fd50a9ded0c065d265cc8181f78b70874d7517df0fce9e1a'
          actual_sha256 = hashlib.sha256(html).hexdigest()
          assert len(html) == expected_size, (len(html), expected_size)
          assert actual_sha256 == expected_sha256, actual_sha256

          (asset_dir / 'index.html').write_bytes(html)
          for p in asset_dir.glob('index.b64.*'):
              p.unlink()
          for p in asset_dir.glob('fix*'):
              p.unlink()
          print(f'Verified index.html: {len(html)} bytes, sha256={actual_sha256}')

      - name: Create temporary release signing key
        run: |
          keytool -genkeypair -v \
            -keystore app/release-key.jks \
            -storepass "$RELEASE_STORE_PASSWORD" \
            -keypass "$RELEASE_KEY_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Japanese Vocab, OU=Personal, O=Bigyoung, L=Seoul, ST=Seoul, C=KR"

      - name: Build signed release APK
        run: gradle :app:assembleRelease

      - name: Verify APK signature and packaged asset
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          unzip -l app/build/outputs/apk/release/app-release.apk | grep 'assets/index.html'
          if unzip -l app/build/outputs/apk/release/app-release.apk | grep -q 'assets/index.b64'; then
            echo 'Unexpected base64 chunks found in APK'
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: JapaneseVocab-release-apk
          path: app/build/outputs/apk/release/app-release.apk
